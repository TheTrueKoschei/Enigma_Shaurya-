[theme]
base = "light"
primaryColor = "#0b4f8a"
backgroundColor = "#f5f6f8"
secondaryBackgroundColor = "#ffffff"
textColor = "#1a1f2b"
font = "sans serif"

[server]
headless = true

[browser]
# No usage telemetry. The only outbound request the app makes is the Google
# Fonts stylesheet (Noto Sans and Noto Sans Devanagari), which is cosmetic and
# falls back to system fonts when there is no connection.
gatherUsageStats = false
